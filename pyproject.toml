[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flipboot"
version = "0.1.0-alpha"
description = "Cross-platform, cross-OS boot switcher for UEFI and Legacy BIOS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Lord_Doug", email = "lord_doug@example.com"},
]
keywords = ["boot", "uefi", "bios", "linux", "windows", "dual-boot", "multi-boot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Boot",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/LordDoug/FlipBoot"
Repository = "https://github.com/LordDoug/FlipBoot"
Issues = "https://github.com/LordDoug/FlipBoot/issues"

[project.scripts]
flipboot = "flipboot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flipboot = ["*.py"]